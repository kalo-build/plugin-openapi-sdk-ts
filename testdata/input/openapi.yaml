openapi: "3.1.0"
info:
  title: Test API
  version: 1.0.0
paths:
  /api/companies:
    get:
      operationId: list_Company
      tags:
        - Company
      summary: List companies
      responses:
        "200":
          description: List of companies
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Company'
    post:
      operationId: create_Company
      tags:
        - Company
      summary: Create company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreate'
      responses:
        "201":
          description: Created company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
  /api/companies/{id}:
    get:
      operationId: get_Company
      tags:
        - Company
      summary: Get company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Company details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
    put:
      operationId: update_Company
      tags:
        - Company
      summary: Update company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyUpdate'
      responses:
        "200":
          description: Updated company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
    delete:
      operationId: delete_Company
      tags:
        - Company
      summary: Delete company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
components:
  schemas:
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - id
        - name
        - created_at
        - updated_at
    CompanyCreate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - name
    CompanyUpdate:
      type: object
      properties:
        name:
          type: string
tags:
  - name: Company
    description: Operations on Company
